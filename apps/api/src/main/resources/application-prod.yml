# ============================================================
# AlgoVision API — Production Profile
# Active when: SPRING_PROFILES_ACTIVE=prod
# All values come from environment variables set on Render.
# NEVER hardcode real values here.
# ============================================================

spring:
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      url: ${REDIS_URL}

logging:
  level:
    com.algovision: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO

jdoodle:
  client-id: ${JDOODLE_CLIENT_ID}
  client-secret: ${JDOODLE_CLIENT_SECRET}
  api-url: https://api.jdoodle.com/v1/execute
  timeout-seconds: 15